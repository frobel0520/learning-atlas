name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      npm_sites: ${{ steps.filter.outputs.npm_sites }}
      fastapi: ${{ steps.filter.outputs.fastapi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="sites/software-engineering-workshop sites/road-to-solution-architect sites/guardrail-workshop sites/AI-Agent-Tutorial sites/aws-lab sites/typescript-lab sites/golang-lab sites/fastapi-learning-lab"
          else
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          fi

          SITES=()
          for s in software-engineering-workshop road-to-solution-architect guardrail-workshop AI-Agent-Tutorial aws-lab typescript-lab golang-lab; do
            if grep -q "^sites/$s/" <<< "$CHANGED"; then
              SITES+=("$s")
            fi
          done

          if [ ${#SITES[@]} -eq 0 ]; then
            echo "npm_sites=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${SITES[@]}" | jq -R . | jq -s -c .)
            echo "npm_sites=$JSON" >> "$GITHUB_OUTPUT"
          fi

          if grep -q "^sites/fastapi-learning-lab/" <<< "$CHANGED"; then
            echo "fastapi=true" >> "$GITHUB_OUTPUT"
          else
            echo "fastapi=false" >> "$GITHUB_OUTPUT"
          fi

  check-npm-sites:
    needs: detect-changes
    if: needs.detect-changes.outputs.npm_sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.detect-changes.outputs.npm_sites) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build ${{ matrix.site }}
        run: |
          case "${{ matrix.site }}" in
            software-engineering-workshop|guardrail-workshop|AI-Agent-Tutorial|aws-lab)
              WORKDIR="sites/${{ matrix.site }}/frontend"
              ;;
            *)
              WORKDIR="sites/${{ matrix.site }}"
              ;;
          esac
          cd "$WORKDIR"
          npm ci
          case "${{ matrix.site }}" in
            road-to-solution-architect)
              ASTRO_BASE="/learning-atlas/${{ matrix.site }}/" npm run build
              # 型別、lint、單元測試、內容驗證、依賴稽核（high／critical 失敗）
              npm run check
              ;;
            typescript-lab|golang-lab)
              VITE_BASE_PATH="/learning-atlas/${{ matrix.site }}/" npm run build
              npm run check
              ;;
            aws-lab|software-engineering-workshop)
              VITE_BASE="/learning-atlas/${{ matrix.site }}/" npm run build
              npm test
              ;;
            *)
              VITE_BASE="/learning-atlas/${{ matrix.site }}/" npm run build
              ;;
          esac

  check-fastapi-lab:
    needs: detect-changes
    if: needs.detect-changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sites/fastapi-learning-lab/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sites/fastapi-learning-lab/apps/api/pyproject.toml

      - name: Test and build fastapi-learning-lab
        working-directory: sites/fastapi-learning-lab
        env:
          BASE_PATH: /learning-atlas/fastapi-learning-lab/
        run: |
          uv pip install --system -e apps/api
          pnpm install --frozen-lockfile
          pnpm test:web
          pnpm typecheck:web
          pnpm build:web:static
